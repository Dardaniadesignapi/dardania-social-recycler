name: Content Recycling

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  recycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Skript ausführen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python scripts/recycle_post.py

      - name: Änderungen an library.json committen
        run: |
          git config user.name "dardania-social-recycler-bot"
          git config user.email "actions@github.com"
          git add content/library.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update: letzte Post-Zeitpunkte aktualisiert"
          git push
