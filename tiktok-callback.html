<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Dardania Social Recycler – TikTok Verbindung</title>
<style>
  body{ font-family: system-ui, sans-serif; background:#121214; color:#f3f1ec; padding:40px 20px; text-align:center; }
  .box{ max-width:480px; margin:0 auto; background:#1e1f23; border:1px solid #303136; border-radius:14px; padding:28px; }
  h1{ font-size:18px; margin-bottom:10px; }
  p{ color:#97968f; font-size:13.5px; line-height:1.5; }
  .code-box{ background:#26272c; border:1px solid #303136; border-radius:8px; padding:14px; margin:18px 0; word-break:break-all; font-family:monospace; font-size:12.5px; color:#d6483c; user-select:all; }
  .hint{ font-size:12px; color:#616167; }
</style>
</head>
<body>
  <div class="box">
    <h1>TikTok Verbindung</h1>
    <p>Falls die Anmeldung erfolgreich war, steht unten dein Code. Kopier ihn und schick ihn im Chat.</p>
    <div class="code-box" id="codeBox">Warte auf Code...</div>
    <p class="hint" id="errorHint"></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    if(code){
      document.getElementById('codeBox').textContent = code;
    }else if(error){
      document.getElementById('codeBox').textContent = 'Fehler: ' + error;
      document.getElementById('errorHint').textContent = errorDesc || '';
    }else{
      document.getElementById('codeBox').textContent = 'Kein Code in der URL gefunden.';
    }
  </script>
</body>
</html>
